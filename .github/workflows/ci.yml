name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace1-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: kody-w/rapp-1
          ref: dda32d741c7218f41443a5bd17eebfe0eae82cb7
          path: rapp-1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Core schemas and pins
        run: |
          python3 -B tools/frame_lens.py schemas
          python3 -B tools/frame_lens.py pins
      - name: Core tests
        env:
          RAPP1_PATH: ${{ github.workspace }}/rapp-1
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ github.workspace }}/.validation/test-artifacts
        run: |
          mkdir -p "$TMPDIR"
          python3 -B -m unittest discover -s tests -v
      - name: Core conformance
        run: >-
          python3 -B tools/frame_lens.py conformance
          --rapp1-path "${{ github.workspace }}/rapp-1"
          --output .validation/workspace1-core-ci
      - name: Compile
        run: python3 -m py_compile tools/*.py protocols/rapp-workspace/1/reference/*.py tests/*.py

  rapp-hive-2-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install rapp-hive/2 reference dependencies
        run: python3 -m pip install "cryptography>=43"
      - name: rapp-hive/2 reference tests and conformance (experimental frontier)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m unittest discover -s protocols/rapp-hive/2/reference/tests -v
          cd protocols/rapp-hive/2/reference
          python3 -B -m rapp_hive2 vectors --check ../conformance/vectors.json
  work-sdk-private-hive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Private Hive test dependencies
        run: >-
          python3 -m pip install
          -r .github/skills/rapp-private-hive/requirements-test.txt
      - name: Work SDK schemas, pins, and conformance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ github.workspace }}/.validation/test-artifacts
        run: |
          mkdir -p "$TMPDIR"
          python3 -B protocols/rapp-work-sdk/1/reference/schema_source.py --check
          python3 -B protocols/rapp-work-sdk/1/reference/pins.py
          python3 -B protocols/rapp-work-sdk/1/reference/conformance.py
          python3 -B .github/skills/rapp-work-sdk/scripts/scaffold.py --preflight
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          for path in Path("protocols/rapp-work-sdk/1/schemas").glob("*.json"):
              schema = json.loads(path.read_text(encoding="utf-8"))
              validator_for(schema).check_schema(schema)
          PY
      - name: Work SDK adversarial tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ github.workspace }}/.validation/test-artifacts
        run: |
          mkdir -p "$TMPDIR"
          python3 -B -m unittest discover -s tests -p 'test_rapp_work_sdk.py' -v
      - name: Private Hive full suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ github.workspace }}/.validation/test-artifacts
        run: |
          mkdir -p "$TMPDIR"
          python3 -B -m unittest discover \
            -s .github/skills/rapp-private-hive/tests -p 'test_*.py' -v
          python3 -B .github/skills/rapp-private-hive/vendor/hive/reference/authenticated_conformance.py
      - name: Compile additive integration
        run: >-
          python3 -m py_compile
          protocols/rapp-work-sdk/1/reference/*.py
          .github/skills/rapp-work-sdk/scripts/*.py
          .github/skills/rapp-private-hive/scripts/*.py
