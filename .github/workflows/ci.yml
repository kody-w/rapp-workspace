name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace1-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: kody-w/rapp-1
          ref: dda32d741c7218f41443a5bd17eebfe0eae82cb7
          path: rapp-1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Core schemas and pins
        run: |
          python3 -B tools/frame_lens.py schemas
          python3 -B tools/frame_lens.py pins
      - name: Core tests
        env:
          RAPP1_PATH: ${{ github.workspace }}/rapp-1
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s tests -v
      - name: Core conformance
        run: >-
          python3 -B tools/frame_lens.py conformance
          --rapp1-path "${{ github.workspace }}/rapp-1"
          --output .validation/workspace1-core-ci
      - name: Compile
        run: python3 -m py_compile tools/*.py protocols/rapp-workspace/1/reference/*.py tests/*.py

  work-organization1-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Candidate schemas and pins
        run: |
          python3 -B tools/work_organization.py schemas
          python3 -B tools/work_organization.py pins
      - name: Candidate conformance
        run: python3 -B tools/work_organization.py conformance
      - name: Compile
        run: >-
          python3 -m py_compile
          tools/work_organization.py
          protocols/rapp-work-organization/1/reference/*.py
          tests/test_work_organization.py
          tests/test_work_organization_p0.py

  hive-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install signed-profile verification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet cryptography jsonschema
      - name: Hive/1 conformance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B protocols/rapp-hive/1/reference/hive_conformance.py
      - name: Hive AutoBest/1 pins and conformance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B protocols/rapp-hive-autobest/1/reference/schema_source.py --check
          python3 -B protocols/rapp-hive-autobest/1/reference/pins.py --check
          python3 -B protocols/rapp-hive-autobest/1/reference/conformance.py
      - name: Compile Hive AutoBest reference
        run: python3 -m py_compile protocols/rapp-hive-autobest/1/reference/*.py

  federation-autobest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install profile requirements
        run: pip install -r protocols/rapp-federation-autobest/1/requirements.txt
      - name: Check schema and reproducible fixture
        run: |
          python3 -B protocols/rapp-federation-autobest/1/reference/schema_source.py --check
          python3 -B protocols/rapp-federation-autobest/1/reference/manifest_source.py --check
          python3 -B protocols/rapp-federation-autobest/1/reference/vectors.py --check
      - name: Run profile conformance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -B protocols/rapp-federation-autobest/1/reference/conformance.py
          --report protocols/rapp-federation-autobest/1/conformance-results.json
      - name: Compile profile reference
        run: python3 -m py_compile protocols/rapp-federation-autobest/1/reference/*.py
